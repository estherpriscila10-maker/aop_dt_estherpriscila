<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="loginstyle.css">
  <style>
    .E-hidden { display: none; }
    .E-message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }
    .E-message.error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
    .E-message.success { background-color: #dcfce7; color: #15803d; border: 1px solid #4ade80; }
    .E-switch-row {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="E-body">
  <main class="E-card">
    <div class="E-top-bar"></div>
    <div class="E-content">
      <div class="E-logo-wrapper">
        <img src="logo.png" alt="Logo" class="E-logo">
      </div>
      
      <h1 id="form-title" class="E-title">Masuk ke akun Anda</h1>
      <p id="form-subtitle" class="E-subtitle">Gunakan username dan password sekolah.</p>

      <div id="message-box" class="E-message E-hidden"></div>

      <form id="login-form" class="E-form" action="CV2.html" method="GET">
        <div class="E-form-group">
          <label for="login-username" class="E-label">Username</label>
          <input type="text" id="login-username" name="username" class="E-input" required autofocus>
        </div>

        <div class="E-form-group">
          <label for="login-password" class="E-label">Password</label>
          <div class="E-password-wrapper">
            <input type="password" id="login-password" name="password" class="E-input E-input-password" required>
            <button type="button" class="E-toggle-btn" onclick="togglePassword('login-password', this)">Lihat</button>
          </div>
        </div>

        <div class="E-options-row">
          <label class="E-checkbox-label">
            <input type="checkbox" name="remember" class="E-checkbox">
            <span class="E-checkbox-text">Ingat saya</span>
          </label>
          <a href="#" class="E-forgot-link">Lupa password?</a>
        </div>

        <button type="submit" class="E-submit-btn">Masuk</button>

        <div class="E-switch-row">
          <span>Belum punya akun? </span>
          <a href="#" id="show-signup" class="E-forgot-link">Daftar di sini</a>
        </div>
      </form>

      <form id="signup-form" class="E-form E-hidden">
        <div class="E-form-group">
          <label for="signup-username" class="E-label">Buat Username</label>
          <input type="text" id="signup-username" class="E-input" required>
        </div>

        <div class="E-form-group">
          <label for="signup-password" class="E-label">Buat Password</label>
          <div class="E-password-wrapper">
            <input type="password" id="signup-password" class="E-input E-input-password" required>
            <button type="button" class="E-toggle-btn" onclick="togglePassword('signup-password', this)">Lihat</button>
          </div>
        </div>

        <div class="E-form-group">
          <label for="signup-confirm" class="E-label">Konfirmasi Password</label>
          <div class="E-password-wrapper">
            <input type="password" id="signup-confirm" class="E-input E-input-password" required>
            <button type="button" class="E-toggle-btn" onclick="togglePassword('signup-confirm', this)">Lihat</button>
          </div>
        </div>

        <button type="submit" class="E-submit-btn">Daftar</button>

        <div class="E-switch-row">
          <span>Sudah punya akun? </span>
          <a href="#" id="show-login" class="E-forgot-link">Masuk di sini</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const messageBox = document.getElementById('message-box');

    const defaultUsers = {
      'admin': 'admin123',
      'siswa': 'sekolah123'
    };

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Sembunyikan';
      } else {
        input.type = 'password';
        btn.textContent = 'Lihat';
      }
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `E-message ${type}`;
    }

    function clearMessage() {
      messageBox.className = 'E-message E-hidden';
      messageBox.textContent = '';
    }

    document.getElementById('show-signup').addEventListener('click', (e) => {
      e.preventDefault();
      clearMessage();
      loginForm.classList.add('E-hidden');
      signupForm.classList.remove('E-hidden');
      formTitle.textContent = 'Buat akun baru';
      formSubtitle.textContent = 'Daftar untuk membuat akun sekolah Anda.';
      document.title = 'Daftar Akun';
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      clearMessage();
      signupForm.classList.add('E-hidden');
      loginForm.classList.remove('E-hidden');
      formTitle.textContent = 'Masuk ke akun Anda';
      formSubtitle.textContent = 'Gunakan username dan password sekolah.';
      document.title = 'Login';
    });

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;

      if (password !== confirm) {
        showMessage('Password dan konfirmasi password tidak cocok!', 'error');
        return;
      }

      const savedUsers = JSON.parse(localStorage.getItem('schoolUsers') || '{}');

      if (defaultUsers[username] || savedUsers[username]) {
        showMessage('Username sudah terdaftar. Silakan pilih username lain.', 'error');
        return;
      }

      savedUsers[username] = password;
      localStorage.setItem('schoolUsers', JSON.stringify(savedUsers));

      signupForm.reset();
      document.getElementById('show-login').click();
      document.getElementById('login-username').value = username;
      showMessage('Akun berhasil dibuat! Silakan masuk.', 'success');
    });

    loginForm.addEventListener('submit', (e) => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const savedUsers = JSON.parse(localStorage.getItem('schoolUsers') || '{}');
      const allUsers = { ...defaultUsers, ...savedUsers };

      if (!allUsers[username] || allUsers[username] !== password) {
        e.preventDefault();
        showMessage('Username atau password salah.', 'error');
      }
    });
  </script>
</body>
</html>
